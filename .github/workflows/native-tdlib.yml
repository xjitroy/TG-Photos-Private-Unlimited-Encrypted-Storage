name: Pinned Android TDLib native build

on:
  push:
    branches: ['feature/**']
    paths:
      - 'core/telegram/src/main/cpp/**'
      - 'scripts/build_tdlib_android.sh'
      - 'scripts/check_native_artifacts.py'
      - 'scripts/check_native_baseline.py'
      - 'scripts/build_tdlib_jni.sh'
      - 'docs/native-baseline.json'
      - '.github/workflows/native-tdlib.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-tdlib-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gperf php libssl-dev zlib1g-dev
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - name: Build pinned public TDLib/OpenSSL and original JNI boundary
        id: baseline-policy
        run: |
          if python3 scripts/check_native_baseline.py can-reuse '${{ matrix.abi }}'; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download the exact public-source native baseline from the private repository
        if: steps.baseline-policy.outputs.reuse == 'true'
        id: baseline-download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, MIT
        with:
          name: tgphotos-tdlib-${{ matrix.abi }}
          run-id: 38067274352
          github-token: ${{ github.token }}
          path: .toolchain/native-baseline/${{ matrix.abi }}/
      - name: Verify baseline and rebuild current original JNI, or rebuild public upstream sources if unavailable
        run: |
          if [ '${{ steps.baseline-policy.outputs.reuse }}' = true ] && [ '${{ steps.baseline-download.outcome }}' = success ]; then
            bash scripts/build_tdlib_jni.sh '${{ matrix.abi }}' '.toolchain/native-baseline/${{ matrix.abi }}'
          else
            bash scripts/build_tdlib_android.sh '${{ matrix.abi }}'
          fi
      - name: Preserve native binaries, licenses and provenance in private repository artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tgphotos-tdlib-${{ matrix.abi }}
          path: .toolchain/native/${{ matrix.abi }}/output/
          if-no-files-found: error
          retention-days: 30

# Downloads/builds public pinned sources only. No personal data or credentials enter this job.
