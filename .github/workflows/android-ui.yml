name: Android preview runtime QA

on:
  push:
    branches: ['feature/**']
    paths:
      - 'app/**'
      - 'feature/**'
      - 'core/designsystem/**'
      - 'gradle/libs.versions.toml'
      - 'core/telegram/**'
      - 'docs/native-runtime-fixture.json'
      - 'scripts/prepare_native_runtime_fixture.py'
      - 'scripts/check_android_ui.py'
      - '.github/workflows/android-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.toolchain/gradle
      TGPHOTOS_EMULATOR_SERIAL: emulator-5554
      ANDROID_AVD_HOME: ${{ github.workspace }}/.toolchain/avd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Check exclusions and compile the owner-authorized development package for QA only
        run: |
          python3 scripts/check_source.py
          python3 scripts/check_secrets.py
          python3 scripts/bootstrap_wrapper.py
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p .toolchain/ui-evidence
          ./gradlew --no-daemon :app:assembleDebug -PapkBuildApproved=true
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print app/build/outputs/apk/debug/app-debug.apk > .toolchain/ui-evidence/merged-manifest.xml
          python3 scripts/check_apk_manifest.py .toolchain/ui-evidence/merged-manifest.xml
      - name: Boot a fresh account-free Android 35 emulator
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n tgphotos-qa -k 'system-images;android-35;google_apis;x86_64' --device pixel_6 --force --path "$ANDROID_AVD_HOME/tgphotos-qa.avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/tgphotos-qa.avd" > "$ANDROID_AVD_HOME/tgphotos-qa.ini"
          "$ANDROID_HOME/emulator/emulator" -avd tgphotos-qa -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 3072 -camera-back none -camera-front none > .toolchain/ui-evidence/emulator.log 2>&1 &
          timeout 180 adb -s emulator-5554 wait-for-device
          for attempt in $(seq 1 150); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 install app/build/outputs/apk/debug/app-debug.apk
      - name: Retrieve exact reviewed native fixture from this private repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tgphotos-tdlib-x86_64
          run-id: 38071501341
          github-token: ${{ github.token }}
          path: .toolchain/native-runtime-fixture
      - name: Verify binary integrity and copy only to instrumentation-native source set
        run: python3 scripts/prepare_native_runtime_fixture.py .toolchain/native-runtime-fixture
      - name: Verify isolated Android Keystore and account-free native session with instrumentation
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest -PapkBuildApproved=true
      - name: Drive app using UI-tree coordinates and capture labelled-preview evidence
        run: python3 scripts/check_android_ui.py
      - name: Preserve only account-free screenshots and QA evidence in the private repository
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tgphotos-preview-ui-evidence
          path: |
            .toolchain/ui-evidence/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the development package and stop the emulator
        if: always()
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -delete
          rm -rf app/src/androidTest/jniLibs
          adb -s emulator-5554 emu kill || true

# Owner authorized APK creation. This is a temporary QA debug package, never a production delivery.
# No account credentials, private files, release signing, APK artifact upload or Play publication.
