name: Android source checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exclusions, source policy and original documents on every change
        run: |
          python3 scripts/check_source.py
          python3 scripts/check_secrets.py
          python3 scripts/bootstrap_wrapper.py
          python3 scripts/extract_references.py
          python3 scripts/test_ci_classification.py
      - name: Classify the entire push or pull-request range
        id: changes
        env:
          TGPHOTOS_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/classify_ci_changes.py
  source-and-android:
    needs: source-policy
    if: needs.source-policy.outputs.android == 'true'

    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.toolchain/gradle
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse only public dependency and verified wrapper distribution downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, MIT, Node 24
        with:
          path: |
            .toolchain/gradle/caches/modules-2
            .toolchain/gradle/wrapper/dists
          key: ${{ runner.os }}-tgphotos-public-gradle-v1-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-tgphotos-public-gradle-v1-
      - name: Verify source, wrapper and owner references
        run: |
          python3 scripts/check_source.py
          python3 scripts/check_secrets.py
          python3 scripts/bootstrap_wrapper.py
          python3 scripts/extract_references.py
      - name: Run offline encryption and backup fault checks
        run: |
          ./scripts/check_crypto_offline.sh
          ./scripts/check_backup_offline.sh
          ./scripts/check_cache_offline.sh
          ./scripts/check_media_offline.sh
      - name: Provision Android compile platform
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile modules, run JVM tests and Android lint without packaging
        run: |
          ./scripts/check_android.sh
          python3 scripts/enrich_dependency_inventory.py
      - name: Confirm no APK or app bundle was created
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          artifacts = list(Path('.').glob('**/*.apk')) + list(Path('.').glob('**/*.aab'))
          if artifacts:
              raise SystemExit('Unapproved application package found')
          print('PASS: no APK/AAB created')
          PY
      - name: Preserve resolved public dependency coordinates and hashes for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tgphotos-resolved-dependency-inventory
          path: .toolchain/dependency-evidence/
          if-no-files-found: error
          retention-days: 30

# No API registration, user files, credentials, APK/AAB upload, signing or publication.
